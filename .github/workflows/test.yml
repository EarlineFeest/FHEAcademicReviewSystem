name: Test and Quality Checks

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  lint:
    name: Code Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Solhint
        run: npm run lint:sol

      - name: Run Prettier check
        run: npm run prettier:check

      - name: Check for console.log statements
        run: |
          echo "Checking for console.log statements in contracts..."
          if grep -r "console.log" contracts/ --include="*.sol"; then
            echo "Error: Found console.log statements in contracts"
            exit 1
          else
            echo "No console.log statements found"
          fi

  test-node-18:
    name: Test on Node.js 18.x
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js 18.x
        uses: actions/setup-node@v4
        with:
          node-version: "18.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Compile contracts
        run: npm run compile

      - name: Run tests
        run: npm test

  test-node-20:
    name: Test on Node.js 20.x
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Compile contracts
        run: npm run compile

      - name: Run tests
        run: npm test

      - name: Run gas reporter
        run: npm run test:gas
        env:
          REPORT_GAS: true

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run coverage
        run: npm run test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
          verbose: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Archive coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30

  security:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"

      - name: Run security audit
        run: npm audit --audit-level=moderate
        continue-on-error: true

      - name: Check for known vulnerabilities
        run: |
          echo "Checking npm packages for vulnerabilities..."
          npm audit --json > audit-report.json || true
          cat audit-report.json

  build:
    name: Build Artifacts
    runs-on: ubuntu-latest
    needs: [lint, test-node-20]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Compile contracts
        run: npm run compile

      - name: Archive artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            artifacts/
            cache/
          retention-days: 7

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [lint, test-node-18, test-node-20, coverage, security]
    if: always()

    steps:
      - name: Check test results
        run: |
          echo "==================================="
          echo "Test Suite Summary"
          echo "==================================="
          echo "✅ Lint: ${{ needs.lint.result }}"
          echo "✅ Test Node 18: ${{ needs.test-node-18.result }}"
          echo "✅ Test Node 20: ${{ needs.test-node-20.result }}"
          echo "✅ Coverage: ${{ needs.coverage.result }}"
          echo "✅ Security: ${{ needs.security.result }}"
          echo "==================================="

      - name: Fail if any job failed
        if: |
          needs.lint.result == 'failure' ||
          needs.test-node-18.result == 'failure' ||
          needs.test-node-20.result == 'failure' ||
          needs.coverage.result == 'failure'
        run: exit 1
