name: Pull Request Checks

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  pr-validation:
    name: PR Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check PR title
        run: |
          PR_TITLE="${{ github.event.pull_request.title }}"
          echo "PR Title: $PR_TITLE"

          # Check if title follows conventional commits
          if [[ ! "$PR_TITLE" =~ ^(feat|fix|docs|style|refactor|test|chore|perf)(\(.+\))?: ]]; then
            echo "❌ PR title should follow conventional commits format"
            echo "Examples: feat: add new feature, fix: resolve bug"
            exit 1
          fi
          echo "✅ PR title follows conventional commits"

      - name: Check for breaking changes
        run: |
          echo "Checking for breaking changes..."
          git diff origin/${{ github.base_ref }}...HEAD --name-only | grep -E "^contracts/.*\.sol$" && echo "⚠️  Contract changes detected" || echo "No contract changes"

      - name: Compile contracts
        run: npm run compile

      - name: Run linters
        run: |
          npm run lint:sol
          npm run prettier:check

      - name: Run tests
        run: npm test

      - name: Check test coverage
        run: npm run test:coverage

      - name: Comment PR with results
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let comment = '## 🤖 Automated PR Checks\n\n';
            comment += '### ✅ All checks passed!\n\n';
            comment += '- Linting: ✓\n';
            comment += '- Tests: ✓\n';
            comment += '- Coverage: ✓\n\n';
            comment += '_Automated by GitHub Actions_';

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

  size-check:
    name: Contract Size Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Compile contracts
        run: npm run compile

      - name: Check contract sizes
        run: |
          echo "Checking contract sizes..."
          echo "==================================="

          for file in artifacts/contracts/**/*.json; do
            if [[ -f "$file" ]] && [[ ! "$file" =~ \.dbg\.json$ ]]; then
              SIZE=$(jq -r '.deployedBytecode' "$file" | wc -c)
              SIZE=$((SIZE / 2))
              CONTRACT=$(basename "$file" .json)

              if [ $SIZE -gt 24576 ]; then
                echo "❌ $CONTRACT: ${SIZE} bytes (exceeds 24KB limit)"
                EXIT_CODE=1
              else
                echo "✅ $CONTRACT: ${SIZE} bytes"
              fi
            fi
          done

          exit ${EXIT_CODE:-0}

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate
